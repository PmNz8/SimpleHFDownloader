[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "hf-gguf-downloader"
version = "0.1.0"
description = "Minimal Windows GUI for downloading complete sharded GGUF models from Hugging Face"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11,<3.14"
dependencies = [
    "huggingface-hub==1.26.0",
]

[project.gui-scripts]
hf-gguf-downloader = "hf_gguf_downloader.__main__:main"

[dependency-groups]
dev = [
    "pyinstaller>=6.16,<7",
    "pytest>=9.0.3,<10",
    "ruff>=0.12,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/hf_gguf_downloader"]

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
